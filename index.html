<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Snake demo</title>
  </head>
  <body>
    <main id="game" class="game">
      <h1>Snake</h1>
      <p class="scores">
        <span>Level <strong id="level">1</strong></span>
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
      </p>
      <p id="special" class="special" hidden>
        <span>Turns <strong id="turns-left">0</strong></span>
        <span>Seconds <strong id="seconds-left">0</strong></span>
        <span>Shield <strong id="shield-left">0</strong></span>
      </p>
      <div class="board-frame">
        <canvas id="board" role="img" aria-label="Snake board"></canvas>
        <p id="banner" class="banner" aria-hidden="true" hidden>Special Level</p>
        <section id="log-panel" class="log-panel" role="dialog" aria-label="Event log" hidden>
          <pre id="log-text" class="log-text"></pre>
          <div id="log-live" class="visually-hidden" aria-live="polite"></div>
          <div class="log-actions">
            <button type="button" id="log-copy">Copy</button>
            <button type="button" id="log-close">Close</button>
          </div>
        </section>
      </div>
      <div id="slow-row" class="slow-row" hidden>
        <button type="button" id="slow" class="slow-button" aria-label="Slow down"></button>
      </div>
      <p class="log-row"><button type="button" id="log-link" class="log-link">Log</button></p>
      <p id="status" class="status" role="status"></p>
      <div class="controls">
        <button type="button" id="start">Start</button>
        <button type="button" id="pause">Pause</button>
        <button type="button" id="new-game">New game</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
