<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Snake demo</title>
  </head>
  <body>
    <main id="game" class="game">
      <h1>Snake</h1>
      <p class="scores">
        <span>Level <strong id="level">1</strong></span>
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
      </p>
      <div class="board-frame">
        <canvas id="board" role="img" aria-label="Snake board"></canvas>
      </div>
      <p id="status" class="status" role="status"></p>
      <div class="controls">
        <button type="button" id="start">Start</button>
        <button type="button" id="pause">Pause</button>
        <button type="button" id="new-game">New game</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
